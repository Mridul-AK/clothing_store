name: clothing_store
description: "Threadline - a Flutter e-commerce clothing app built with Clean Architecture and BLoC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/data/products.json
